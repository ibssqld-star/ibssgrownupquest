
<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>IBSS Grown Up Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#170d20; --stone:#3b2152; --stone-dk:#28163a; --stone-lt:#5a3478; --edge:#0b0610;
  --gold:#a6ce39; --gold-dk:#2bb673; --parch:#f7f3fb; --parch-dk:#e4d8ef; --parch-edge:#662d91;
  --ink:#1c1024; --ink-soft:#4e3a5e; --jac:#662d91; --jac-lt:#d58bd0; --pink:#ed1e79; --green:#2bb673;
  --ok:#2f7d3c; --bad:#a23b2f; --blue:#1f4f9c;
  --px:'Fredoka',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ground)}
body{color:var(--parch);font-family:var(--body);font-size:16px;line-height:1.45;
  background-image:radial-gradient(circle at 20% 0%,#2a2119 0,transparent 55%),radial-gradient(circle at 90% 100%,#231b28 0,transparent 50%);}
body.large{font-size:19px}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:12px 28px}
header.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.brand{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{align-items:center!important}
.brand img{height:64px;width:auto;background:#fff;border-radius:10px;padding:4px;border:3px solid #000;box-shadow:0 0 0 2px var(--jac)}
.brand h1{font-family:var(--px);font-weight:700;font-size:2em;margin:0;letter-spacing:.02em;
  background:linear-gradient(90deg,#a6ce39,#2bb673 30%,#9b4dca 62%,#ed1e79);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 2px 0 #000)}
.brand span{font-family:var(--px);color:var(--jac-lt);font-size:1em}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--px);background:var(--stone-dk);border:2px solid var(--stone-lt);box-shadow:inset 0 0 0 2px #000;
  padding:4px 12px;color:var(--gold);font-size:1.05em;font-variant-numeric:tabular-nums}
.chip b{color:var(--parch);font-weight:400;margin-right:6px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px;align-items:start}
@media (max-width:880px){.layout{grid-template-columns:minmax(0,1fr)}}
.frame{background:var(--stone);border:3px solid var(--stone-lt);box-shadow:0 0 0 3px var(--edge),inset 0 0 0 3px var(--stone-dk),0 10px 30px rgba(0,0,0,.5);padding:6px}
.viewport{position:relative;background:#000;line-height:0}
#game{display:block;width:100%;touch-action:manipulation;cursor:pointer;image-rendering:pixelated}
.nextbar{position:absolute;left:8px;top:8px;right:84px;display:flex;justify-content:flex-start;pointer-events:none;line-height:1.3}
.nextbar div{font-family:var(--px);background:rgba(20,15,10,.82);border:2px solid var(--gold-dk);color:var(--gold);padding:4px 10px;font-size:.95em;max-width:100%}
.fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s}
.fade.on{opacity:1}
.calc{position:fixed;right:16px;bottom:16px;z-index:95;width:min(260px,calc(100vw - 32px));background:#2d3640;border:3px solid #000;box-shadow:0 0 0 2px var(--gold-dk),0 10px 30px rgba(0,0,0,.6);border-radius:14px;padding:10px;font-family:var(--body)}
.calc[hidden]{display:none!important}
.calc-top{display:flex;justify-content:space-between;align-items:center;color:#e6f3ff;margin-bottom:6px}.calc-top button{background:none;border:none;color:#e6f3ff;font-size:1.2em;min-width:36px;min-height:36px}
.calc-scr{background:#0f3b2f;border:2px solid #061a14;border-radius:8px;padding:6px 10px;text-align:right;color:#d6ffe6;font-variant-numeric:tabular-nums;margin-bottom:8px}
.calc-scr small{display:block;color:#9ff0c0;min-height:1.2em;font-size:.85em;overflow:hidden;white-space:nowrap}
.calc-scr span{display:block;font-size:1.8em;font-weight:700;overflow:hidden;white-space:nowrap}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.calc-keys button{min-height:44px;border:2px solid #000;border-radius:8px;background:#dfe6ec;color:#12202b;font-size:1.15em;font-weight:700}
.calc-keys button.op{background:#f0c24b}.calc-keys button.eq{background:#2f7d3c;color:#fff;grid-row:span 2}.calc-keys button.cl{background:#c86a5a;color:#fff}.calc-keys button.zero{grid-column:span 2}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;line-height:1.2}
.mapbtn{font-family:var(--body);font-weight:700;background:#fff;color:#1a73e8;border:none;border-radius:20px;padding:8px 16px;box-shadow:0 1px 4px rgba(0,0,0,.4);min-height:40px}
.rchip{order:2;font-family:var(--body);font-weight:700;background:#ffd23f;color:#202124;border:2px solid #000;border-radius:18px;padding:5px 12px;max-width:220px;text-align:left}
.mbox.wide{width:min(900px,100%);padding:0;background:#fff;border:none;box-shadow:0 0 0 3px #000,0 10px 40px rgba(0,0,0,.6);border-radius:12px;color:#202124}
.gm{font-family:var(--body)}
.gm-top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #e0e0e0}
.gm-top b{font-size:1.15em}.gm-where{color:#5f6368;font-size:.9em;flex:1}
.gm-x{background:none;border:none;font-size:1.3em;color:#5f6368;min-width:40px;min-height:40px}
.gm-search{padding:8px 12px 0}.gm-search input{width:100%;border:1px solid #dadce0;border-radius:24px;padding:10px 16px;font-size:1em;background:#fff;color:#202124;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.gm-cats{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px}
.gm-cats button{border:1px solid #dadce0;background:#fff;border-radius:16px;padding:6px 12px;color:#3c4043;font-size:.9em}
.gm-cats button[aria-pressed="true"]{background:#e8f0fe;border-color:#1a73e8;color:#1967d2}
.gm-wrap{padding:0 4px;line-height:0;position:relative}#gmc{display:block;margin:0 auto;border-radius:8px;cursor:grab;touch-action:none}
.gm-zoom{position:absolute;right:14px;bottom:10px;display:flex;flex-direction:column;gap:6px;line-height:1}.gm-zoom button{width:40px;height:40px;border-radius:8px;border:none;background:#fff;color:#444;font-size:22px;font-weight:700;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gm-card{padding:10px 14px;border-top:1px solid #e0e0e0}.gm-card p{margin:4px 0}
.gm-name{font-size:1.2em;font-weight:700}.gm-sub{color:#5f6368;font-size:.9em}.gm-hint{color:#5f6368}
.gm-trav{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:8px}
.gm-trav button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid #dadce0;background:#fff;border-radius:10px;padding:8px 12px;color:#202124;text-align:left}
.gm-trav button:first-child{background:#1a73e8;color:#fff;border-color:#1a73e8}.gm-trav button span{font-size:.82em;opacity:.85}
.gm-card .btn{font-family:var(--body);background:#1a73e8;color:#fff;border:none;border-radius:20px;box-shadow:none;padding:10px 22px}
.gm-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px;padding:6px 10px 12px;max-height:190px;overflow-y:auto;border-top:1px solid #e0e0e0}
.gm-list button{display:flex;gap:8px;align-items:center;text-align:left;background:#fff;border:1px solid transparent;border-radius:8px;padding:6px 8px;color:#202124}
.gm-list button.on,.gm-list button:hover{background:#f1f3f4}
.gm-list i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:.8em}
.gm-list small{display:block;color:#5f6368;font-size:.8em}
#mini{position:absolute;right:8px;bottom:8px;border:2px solid #000;box-shadow:0 0 0 2px var(--gold-dk);pointer-events:none;image-rendering:pixelated;opacity:.92}

/* chat + dialog: parchment box under the world, like the classic MMO chatbox */
.lower{margin-top:6px;background:var(--parch);color:var(--ink);border:3px solid var(--parch-edge);box-shadow:inset 0 0 0 2px var(--parch-dk);min-height:176px;position:relative}
.chat{height:176px;overflow-y:auto;padding:8px 12px;font-size:.95em}
.chat p{margin:0 0 3px}
.chat .sys{color:var(--blue)} .chat .lvl{color:#6b3fb5;font-weight:700} .chat .warn{color:var(--bad);font-weight:700} .chat .good{color:var(--ok);font-weight:700}
.dialog{display:grid;grid-template-columns:84px minmax(0,1fr);gap:12px;padding:12px}
.dialog[hidden]{display:none!important}
.portrait{width:84px;height:84px;background:var(--parch-dk);border:2px solid var(--parch-edge);image-rendering:pixelated}
.d-name{font-family:var(--px);font-weight:700;color:#7a3f12;font-size:1.15em}
.d-text{font-size:1.08em;margin:2px 0 8px;max-width:68ch}
.d-tip{font-size:.9em;color:var(--ink-soft);border-left:3px solid var(--jac);padding-left:8px;margin-bottom:8px;font-style:italic}
.d-opts{display:flex;flex-direction:column;gap:6px}
.opt{text-align:left;background:var(--stone);color:var(--parch);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--stone-lt);padding:9px 12px;min-height:44px}
.opt:hover{background:#4a2a66;color:var(--gold)}
.opt .k{font-family:var(--px);color:var(--gold);margin-right:8px}
.opt.cont{align-self:flex-start;font-family:var(--px);color:var(--gold)}
@media (max-width:520px){.dialog{grid-template-columns:56px minmax(0,1fr)} .portrait{width:56px;height:56px}}

/* side panel */
.side .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-bottom:6px}
.tab{background:var(--stone-dk);color:var(--parch-dk);border:2px solid var(--edge);box-shadow:inset 0 0 0 2px var(--stone-lt);padding:8px 2px;font-family:var(--px);font-size:.95em}
.tab[aria-selected="true"]{background:#6b4a22;color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-dk)}
.pane{background:var(--stone-dk);border:2px solid var(--edge);padding:10px;min-height:300px}
.pane h2{font-family:var(--px);color:var(--gold);font-size:1.15em;margin:0 0 8px;font-weight:600}
.quest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.quest li{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start;color:#e46a5a}
.quest li.done{color:#7fcf7a;text-decoration:line-through;text-decoration-color:rgba(127,207,122,.5)}
.quest li.now{color:var(--gold)}
.quest li .m{font-family:var(--px)}
.qnote{margin-top:12px;font-size:.88em;color:var(--parch-dk)}
.pack{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{aspect-ratio:1;max-width:100%;background:#1f1230;border:2px solid #10081a;box-shadow:inset 0 0 0 1px #4a2a66;display:flex;align-items:center;justify-content:center;padding:4px;color:inherit}
.slot svg{width:100%;height:100%}
.slot.sel{border-color:var(--gold);box-shadow:inset 0 0 0 2px var(--gold-dk)}
.idesc{margin-top:10px;font-size:.92em;color:var(--parch);min-height:3em}
.skill{margin-bottom:12px}
.skill .row{display:flex;justify-content:space-between;font-family:var(--px);font-size:1.05em}
.skill .lv{color:var(--gold);font-variant-numeric:tabular-nums}
.bar{height:12px;background:#10081a;border:2px solid #000;margin-top:3px}
.bar i{display:block;height:100%}
.set{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid #4a2a66}
.tog{min-width:64px;padding:6px 10px;background:var(--stone);color:var(--parch);border:2px solid var(--edge);font-family:var(--px)}
.tog[aria-pressed="true"]{background:var(--ok);color:#fff}
.set small{display:block;color:var(--parch-dk);font-size:.82em}
.danger{margin-top:12px;width:100%;padding:9px;background:#5a2019;color:#ffd9d2;border:2px solid #000;font-family:var(--px)}

/* modals */
.modal{position:fixed;inset:0;background:rgba(8,6,4,.72);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal[hidden]{display:none!important}
.mbox{background:var(--parch);color:var(--ink);border:4px solid var(--parch-edge);box-shadow:0 0 0 3px #000,inset 0 0 0 3px var(--parch-dk);width:min(560px,100%);max-height:calc(100% - 8px);overflow-y:auto;padding:18px 20px}
.held{position:fixed;left:16px;top:50%;transform:translateY(-50%);z-index:60;width:300px;font-family:Arial,Helvetica,sans-serif;color:#111}
.held[hidden]{display:none!important}
.held .hbag{background:#6b4a2b;border:3px solid #000;border-radius:10px;padding:10px;color:#fff;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.held .hbag h4{margin:0 0 8px;font-size:15px}.held .hbag button{display:block;color:#111;width:100%;margin:5px 0;padding:9px;text-align:left;background:#f4eefa;border:2px solid #000;border-radius:6px;font:700 14px Arial;cursor:pointer}
.held .hbag button:hover,.held .hbag button:focus{background:#ffe08a}
.hwrap{position:relative;width:300px;height:250px}
.hwrap .hdoc{position:absolute;left:14px;top:6px;width:272px;transform:rotate(-3deg);box-shadow:0 6px 18px rgba(0,0,0,.5)}
.hwrap svg{position:absolute;left:0;top:0;pointer-events:none}
.hbtns{display:flex;gap:6px;margin-top:4px}.hbtns button{flex:1;padding:8px;color:#111;background:#f4eefa;border:2px solid #000;border-radius:6px;font:700 13px Arial;cursor:pointer}
.hdoc{font-family:Arial,Helvetica,sans-serif;border-radius:12px;overflow:hidden;font-size:12px;line-height:1.25}
.hdoc.mc{background:linear-gradient(135deg,#2f9a5a,#1d7a44);color:#fff;padding:12px 14px;height:168px}
.hdoc.mc .t{font:900 20px Arial;letter-spacing:.02em;font-style:italic}.hdoc.mc .n{font:700 19px 'Courier New',monospace;letter-spacing:.06em;margin:10px 0 6px;background:rgba(255,255,255,.14);padding:2px 6px;border-radius:4px}
.hdoc.mc .ppl div{font:700 12.5px 'Courier New',monospace}.hdoc.mc .v{position:absolute;right:14px;bottom:10px;font-size:10px}
.hdoc.sid{background:#fff;border:2px solid #1b3b7a;height:168px}.hdoc.sid .top{background:#1b3b7a;color:#fff;padding:6px 10px;font-weight:900}
.hdoc.sid .bd{display:flex;gap:10px;padding:8px 10px}.hdoc.sid canvas{border:1px solid #999;background:#cfe3f5;image-rendering:pixelated}
.hdoc.paper{background:#fffdf4;border-radius:3px;padding:10px 12px;border:1px solid #bbb;font-size:11.5px}
.hdoc.paper h5{margin:0 0 4px;font-size:13px;text-align:center}.hdoc.paper .row{display:flex;justify-content:space-between;border-bottom:1px dotted #aaa;padding:2px 0}.hdoc.paper .row b{text-align:right}
@media (max-width:1100px){.held{top:auto;bottom:6px;transform:none;left:6px;width:230px}.hwrap{transform:scale(.76);transform-origin:left bottom;height:190px}.modal.holding{padding-bottom:200px}}
.mbox.paper{width:min(680px,100%);padding:0;background:#fff;border:none;box-shadow:0 0 0 3px #000,0 10px 40px rgba(0,0,0,.6);color:#111}
.gf{position:relative;font-family:Arial,Helvetica,sans-serif;padding:18px 22px 16px;overflow:hidden}
.gf-wm{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font-size:92px;font-weight:900;color:rgba(200,0,0,.06);letter-spacing:.1em;pointer-events:none;white-space:nowrap}
.gf-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;border-bottom:4px solid #111;padding-bottom:8px}
.gf-ag{font-weight:900;font-size:1.15em;letter-spacing:.01em}.gf-sub{font-size:.9em}
.gf-code{border:2px solid #111;padding:4px 8px;font-size:.78em;font-weight:700;text-align:right;max-width:45%}
.gf.online .gf-head{border-bottom:none;background:#1f2a44;color:#fff;margin:-18px -22px 10px;padding:12px 22px}
.gf-bag{display:block;width:100%;margin:8px 0 4px;padding:10px;background:#fff6d6;border:2px dashed #8a6a1a;border-radius:6px;font:700 14px Arial;color:#5a430c;cursor:pointer;text-align:left}.gf-bag:hover{background:#ffeaa0}
.gf-title{font-family:Arial,Helvetica,sans-serif!important;color:#111!important;font-size:1.35em!important;margin:12px 0 4px!important}
.gf-ins{font-size:.88em;margin:0 0 8px!important;color:#333}
.gf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.gf-sec{grid-column:1/-1;display:flex;align-items:center;gap:8px;background:#111;color:#fff;font-weight:700;padding:5px 8px;margin-top:8px;font-size:.95em}
.gf-sec i{font-style:normal;background:#fff;color:#111;border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.85em}
.gf.online .gf-sec{background:#e8eef7;color:#1f2a44}.gf.online .gf-sec i{background:#1f2a44;color:#fff}
.gf-txt{grid-column:1/-1;font-size:.9em;margin:0!important}
.gf-f{display:flex;flex-direction:column;gap:3px;font-weight:400}.gf-f.full{grid-column:1/-1}
.gf-l{font-weight:700;font-size:.9em}.gf-h{color:#555;font-size:.8em}
.gf input{font-family:'Courier New',monospace;font-size:1.05em;border:1.5px solid #111;border-radius:0;background:#fff;color:#111;padding:7px 8px;text-transform:uppercase;letter-spacing:.06em;width:100%}
.gf.online input{font-family:Arial,Helvetica,sans-serif;text-transform:none;letter-spacing:0;border-radius:4px;border-color:#8a94a6}
.gf input.gf-lc,.gf input[type=password]{text-transform:none}
.gf-comb{max-width:9.2em;letter-spacing:1.35em!important;padding-left:.6em!important;background:repeating-linear-gradient(90deg,#fff 0 2.05em,#111 2.05em 2.15em)!important}
.gf-date{display:flex;align-items:center;gap:4px}.gf-date input{width:3.2em;text-align:center;padding:7px 2px}.gf-date input.y{width:4.8em}
.gf-sig{font-family:'Brush Script MT','Segoe Script','Snell Roundhand',cursive!important;font-size:1.5em!important;text-transform:none!important;letter-spacing:0!important;border:none!important;border-bottom:2px solid #111!important;background:#fbfbf6!important}
.gf-ticks{display:flex;flex-wrap:wrap;gap:6px 16px}
.gf-tick{display:flex;flex-direction:row!important;align-items:center;gap:8px;font-size:.95em;font-weight:400!important;cursor:pointer;min-height:32px}
.gf-tick input{position:absolute;opacity:0;width:1px;height:1px}
.gf-tick span{width:20px;height:20px;border:2px solid #111;display:inline-flex;align-items:center;justify-content:center;flex:none;background:#fff}
.gf-tick input:checked+span::after{content:'✓';font-weight:900;color:#1f4f9c;font-size:17px;line-height:1}
.gf-tick input:focus-visible+span{outline:3px solid #f0c24b}
.gf-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-top:12px;border-top:1px solid #bbb;padding-top:10px}
.gf-foot small{color:#a02020;font-weight:700;font-size:.78em;flex:1;min-width:180px}
.gf-btn{background:#111;color:#fff;border:none;padding:11px 20px;font-weight:700;font-size:1em;min-height:44px}
.gf.online .gf-btn{background:#1a5fd1;border-radius:6px}
@media (max-width:520px){.gf-grid{grid-template-columns:1fr}.gf{padding:14px}.gf-wm{font-size:60px}}
.mbox h2{font-family:var(--px);margin:0 0 6px;color:#662d91;font-size:1.5em;text-wrap:balance}
.mbox p{margin:0 0 10px}
.note{background:#efe6f8;border:2px dashed var(--parch-edge);padding:8px 10px;font-size:.93em;margin-bottom:12px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fgrid .full{grid-column:1/-1}
@media (max-width:480px){.fgrid{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:3px;font-weight:700;font-size:.93em}
label small{font-weight:400;color:var(--ink-soft)}
input,select{font:inherit;padding:9px 10px;border:2px solid var(--parch-edge);background:#fffaf0;color:var(--ink);width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{font-family:var(--px);font-size:1.08em;padding:10px 18px;background:var(--stone);color:var(--gold);border:2px solid #000;box-shadow:inset 0 0 0 2px var(--stone-lt);min-height:44px}
.btn:hover{background:#4a2a66}
.btn.alt{background:#e4d8ef;color:var(--ink);box-shadow:inset 0 0 0 2px #9b6fc4}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin-top:6px}
.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;background:#ece3f5;border:3px solid #9b6fc4;color:var(--ink);font-size:.88em;text-align:center}
.pick svg{width:48px;height:48px}
.pick[aria-pressed="true"]{border-color:var(--ok);background:#cfe6c2}
/* keypad */
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:10px auto 0}
.pad button{font-family:var(--px);font-size:1.5em;padding:12px 0;background:#39414a;color:#fff;border:2px solid #000;box-shadow:inset 0 -3px 0 #22282e}
.pad button:active{transform:translateY(2px)}
.dots{display:flex;gap:12px;justify-content:center;margin:8px 0}
.dots i{width:20px;height:20px;border:3px solid var(--ink);border-radius:50%}
.dots i.f{background:var(--ink)}
.atm{background:#2d3640;border:4px solid #151a1f;padding:14px;color:#e6f3ff}
.atm .scr{background:#0f3b2f;color:#9ff0c0;font-family:var(--px);padding:14px;min-height:120px;border:3px solid #061a14;font-size:1.1em;line-height:1.4}
.atm .scr big{font-size:1.6em;display:block;color:#d6ffe6}
.atm .sb{display:grid;gap:8px;margin-top:10px}
.atm .sb button{background:#dfe6ec;color:#12202b;border:2px solid #000;padding:10px;font-weight:700}
.atm .pad button{background:#555c63}
.cover{position:relative}
.cover.on::after{content:"✋ keypad covered";position:absolute;right:-6px;top:-10px;background:var(--gold);color:#000;font-family:var(--px);font-size:.8em;padding:2px 6px;border:2px solid #000}
.phone{width:min(330px,100%);margin:0 auto;background:#111;border-radius:28px;padding:14px 12px 22px;border:3px solid #444}
.phone .sc{background:#f4f4f6;border-radius:16px;padding:12px;min-height:260px;color:#111}
.phone .from{font-weight:700;font-size:.9em;color:#555;text-align:center;margin-bottom:10px}
.bubble{background:#e3e3e8;border-radius:16px;padding:10px 12px;font-size:.95em}
.bubble u{color:#1a5fd1}
.check li{margin-bottom:4px}
.scroll{background:#f6ecd0;border:2px solid var(--parch-edge);padding:10px 14px;margin:10px 0}
.scroll h3{font-family:var(--px);margin:0 0 6px;color:#662d91}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;background:var(--stone-dk);border:3px solid var(--gold);color:var(--gold);font-family:var(--px);padding:10px 18px;font-size:1.2em;box-shadow:0 0 0 3px #000;text-align:center}
.toast[hidden]{display:none!important}
.looks{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:start}
@media (max-width:480px){.looks{grid-template-columns:1fr}}
.prev{width:120px;height:120px;background:#5b9a3e;border:3px solid var(--parch-edge);image-rendering:pixelated}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.sw button{width:34px;height:34px;border:3px solid #000}
.sw button[aria-pressed="true"]{outline:3px solid var(--jac);outline-offset:1px}
.sw.txt button{width:auto;padding:0 10px;background:#ece3f5;color:var(--ink);font-size:.85em}
.quick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.quick span{font-family:var(--px);color:var(--gold);margin-right:2px}
.quick button{font-family:var(--px);font-size:.92em;background:var(--stone-dk);color:#8fe3ff;border:2px solid var(--edge);box-shadow:inset 0 0 0 1px var(--stone-lt);padding:6px 10px;min-height:38px}
.quick button:hover{color:var(--gold)}
.chip.online span{color:#8fe3ff}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:0 0 8px}
.qhead h2{margin:0}
.track{font-family:var(--px);font-size:.85em;padding:3px 8px;background:var(--stone);color:var(--parch-dk);border:2px solid var(--edge)}
.track[aria-pressed="true"]{background:#6b4a22;color:var(--gold)}
.qblock+.qblock{margin-top:16px;padding-top:12px;border-top:2px solid #4a2a66}
.drill{display:grid;gap:8px;margin:10px 0}
.drill button{display:grid;grid-template-columns:30px 1fr;align-items:center;text-align:left;gap:8px;padding:10px;background:#ece3f5;border:3px solid #9b6fc4;color:var(--ink);min-height:48px}
.drill button[aria-pressed="true"]{background:#cfe6c2;border-color:var(--ok)}
.drill .bx{width:26px;height:26px;border:3px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.results li{margin-bottom:4px;list-style:none}
.results{padding-left:0}
/* driving lesson */
.drive{position:fixed;inset:0;z-index:80;background:#15181c;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);user-select:none;-webkit-user-select:none}
.drive[hidden]{display:none!important}
.dbar{display:flex;gap:10px;align-items:center;padding:8px 12px;background:var(--parch);color:var(--ink);border-bottom:3px solid var(--parch-edge)}
.dbar .who{font-family:var(--px);font-weight:700;color:#7a3f12;white-space:nowrap}
.dbar .say{flex:1;font-size:1.05em;min-height:2.6em;display:block;align-self:center}
.dbar .x{font-family:var(--px);background:var(--stone);color:var(--parch);border:2px solid #000;padding:6px 10px}
#dcv{flex:1;min-height:0;width:100%;display:block;touch-action:none}
.dash{display:grid;grid-template-columns:100px repeat(3,minmax(0,1fr)) minmax(0,1fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,1fr);gap:8px;padding:10px 12px;background:#23272d;border-top:3px solid #000}
.dash button{font-family:var(--px);font-size:1.05em;border:3px solid #000;min-height:64px;color:#fff;touch-action:none}
.speedo{background:#0b0d10;border:3px solid #000;color:#9ff0c0;font-family:var(--px);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;font-variant-numeric:tabular-nums}
.speedo b{font-size:2em}
.speedo small{color:#fff;background:#fff;color:#000;border:3px solid #c62828;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-weight:700;margin-top:3px}
.speedo.over b{color:#ff6b5a}
.ind{background:#3a3f46}.ind.on{background:#c77a12;animation:blink .7s steps(1) infinite}
.mir{background:#2f5d8a}.mir.flash{background:#2f7d3c}
.brake{background:#8a2d25}.gas{background:#2f7d3c}.steer{background:#4a4f57}
.steer.down{filter:brightness(1.4);transform:translateY(2px)}
.brake.down,.gas.down{filter:brightness(1.35);transform:translateY(2px)}
.phonebtn{font-family:var(--px);background:#222;color:#fff;border:2px solid #666;padding:6px 10px}
@keyframes blink{50%{background:#3a3f46}}
@media (max-width:640px){.dash{grid-template-columns:90px repeat(3,minmax(0,1fr));grid-template-areas:"sp l m r" "sl br ga sr"}
 .speedo{grid-area:sp}.dash .l{grid-area:l}.dash .m{grid-area:m}.dash .r{grid-area:r}.dash .brake{grid-area:br}.dash .gas{grid-area:ga}.dash .sl{grid-area:sl}.dash .sr{grid-area:sr}.dash button{min-height:56px;font-size:.95em}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.ind.on{animation:none}}

let AC;
function tone(fs,d=.09){if(!S.settings.sound||S.settings.calm)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 fs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.04,t+i*d);g.gain.exponentialRampToValueAtTime(.0001,t+i*d+d*.95);o.connect(g).connect(AC.destination);o.start(t+i*d);o.stop(t+i*d+d)})}catch(e){}}
function speak(t){if(!S.settings.read||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/<[^>]+>/g,''));u.lang='en-AU';u.rate=.95;speechSynthesis.speak(u)}catch(e){}}

function knownList(){const on=others.filter(o=>o.dv&&o.name);const ids=new Set(on.map(o=>o.dv));return[...on,...Object.keys(S.known||{}).filter(dv=>dv!==DEV&&!ids.has(dv)).map(knownGet)]}
function knownAt(hb){return knownList().filter(o=>o.dv&&houseFor(o.dv)===hb)}
function friendPlaces(){for(let i=PLACES.length-1;i>=0;i--)if(String(PLACES[i].id).startsWith('fh_'))PLACES.splice(i,1);knownList().forEach(o=>{const b=houseFor(o.dv);if(!b)return;PLACES.push({id:'fh_'+o.dv,n:o.name+'\'s house',cat:'Home & school',b:b.id,ic:'H',c:'#E85D9A',sub:o.off?'Friend\'s house':'Friend\'s house · online now',info:'Walk to the door and tap the house to visit.'})});
 if(LF().mv.search||LF().flatId){if(!PLACES.some(p=>p.id==='flat'))PLACES.push({id:'flat',n:'Share house (West End)',cat:'Home & school',b:FLATB().id,ic:'H',c:'#3a7a8a',sub:'Your share house'})}}
function canInviteFlat(){return!!LF().mv.moved}
function inviteFlat(o){FI={to:String(o.peer),t:Date.now()};pub();const t=FI.t;setTimeout(()=>{if(FI.t===t){FI={to:'',t:0};pub()}},9000);chat('You invited <b>'+esc(o.name)+'</b> to be flatmates.','sys');tone([660,880],.05)}
function lifePeers(list){S.known=S.known||{};const byPeer=new Map(list.map(pe=>[pe.peer,pe.presence||{}]));let ch=false;
 others.forEach(o=>{const pr=byPeer.get(o.peer)||{};o.fl=typeof pr.fl==='string'?pr.fl.replace(/[^a-z0-9]/gi,'').slice(0,16):'';const gr=pr.gr===1;if(gr&&o.gr===false){chat('🎓 <b>'+esc(o.name)+'</b> just graduated!','lvl');toast(o.name+' graduated!')}o.gr=gr;
  if(o.dv&&o.name){const k=S.known[o.dv];if(!k||k.n!==o.name||(k.bl||'')!==(o.bl||'')){S.known[o.dv]={n:o.name,bl:o.bl||'',t:Date.now()};ch=true}}
  if(pr.fi===SID&&pr.ft&&fiSeen[o.peer]!==pr.ft&&Date.now()-Number(pr.ft)<20000){fiSeen[o.peer]=pr.ft;const inv=o;setTimeout(()=>{const go=()=>{if(!lifeDo(async()=>{const ok=await inviteCard({kicker:'Flatmate invite!',title:inv.name+' wants you as a flatmate',sub:'Share their house? You\'ll see each other when you\'re both at the share house.',col:'#3a7a8a',yes:'Yes, move in!',no:'No thanks'});if(ok){LF().flatId=inv.fl||inv.dv;flatDoor();toast('You\'re flatmates with '+inv.name+'!');chat('You and <b>'+esc(inv.name)+'</b> now share a house in West End.','good')}}))setTimeout(go,800)};go()},100)}});
 if(ch&&Date.now()-lastKnownSave>5000){lastKnownSave=Date.now();save()}friendPlaces();
 const here=others.filter(o=>o.map==='home:'+DEV),iAmHome=S.map==='home'&&!S.visit;
 here.forEach(o=>{if(atMine.has(o.peer))return;atMine.add(o.peer);if(iAmHome){toast(o.name+' came over!');chat('<b>'+esc(o.name)+'</b> came to visit!','good');return}
  tone([880,660,880],.08);try{navigator.vibrate&&navigator.vibrate([100,60,100])}catch(e){}chat('🔔 <b>'+esc(o.name)+'</b> is at your house!','lvl');
  if(!lifeDo(async()=>{const ok=await inviteCard({kicker:'Knock knock!',title:o.name+' is at your house',sub:'They came to visit while you were out.',col:'#E85D9A',yes:'Go home',no:'OK'});if(ok){S.visit=null;S.curB='home';enterMap('home',7,8,'up')}}))toast(o.name+' is at your house!')});
 [...atMine].forEach(pid=>{if(!here.some(o=>o.peer===pid))atMine.delete(pid)})}
{const _sp=syncPeers;syncPeers=function(list){_sp(list);try{lifePeers(list)}catch(e){console.warn(e)}}}

$('#quick').querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>sayPhrase(+b.dataset.i));

connectRoom();
(()=>{const K=[['C','cl'],['⌫','cl'],['÷','op'],['×','op'],['7'],['8'],['9'],['−','op'],['4'],['5'],['6'],['+','op'],['1'],['2'],['3'],['=','eq'],['0','zero'],['.']];
 const box=$('#calc .calc-keys');box.innerHTML=K.map(([k,c])=>`<button class="${c||''}" data-k="${k}">${k}</button>`).join('');
 let exp='',last=null;const out=$('#calcOut'),ex=$('#calcExp');
 const fmt=n=>{if(!isFinite(n))return'Error';const r=Math.round(n*1e8)/1e8;return String(r)};
 const calc=e=>{const t=e.match(/\d*\.?\d+|[+−×÷]/g);if(!t)return 0;let a=[];for(let i=0;i<t.length;i++){const x=t[i];if(x==='×'||x==='÷'){const b=parseFloat(t[++i]);const v=a.pop();a.push(x==='×'?v*b:v/b)}else if(x==='+'||x==='−')a.push(x);else a.push(parseFloat(x))}
  let r=a[0];for(let i=1;i<a.length;i+=2){r=a[i]==='+'?r+a[i+1]:r-a[i+1]}return r};
 const show=()=>{out.textContent=exp||'0'};
 box.querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;tone([900],.02);
  if(k==='C'){exp='';ex.innerHTML='&nbsp;';show();return}
  if(k==='⌫'){exp=exp.slice(0,-1);show();return}
  if(k==='='){if(!exp)return;if(/[+−×÷]$/.test(exp))exp=exp.slice(0,-1);const r=calc(exp);ex.textContent=exp+' =';exp=fmt(r);last=exp;show();return}
  if('+−×÷'.includes(k)){if(!exp&&k!=='−')return;if(/[+−×÷]$/.test(exp))exp=exp.slice(0,-1);exp+=k;show();return}
  if(k==='.'){const seg=exp.split(/[+−×÷]/).pop();if(seg.includes('.'))return;if(!seg)exp+='0'}
  if(last!==null&&exp===last&&k!=='.'){exp=''}last=null;exp+=k;show()});
 $('#calcBtn').onclick=()=>{$('#calc').hidden=!$('#calc').hidden};$('#calcX').onclick=()=>{$('#calc').hidden=true}})();
$('#mapBtn').onclick=()=>{if(!S.seenMap){S.seenMap=1;$('#mapBtn').classList.remove('newflash');save()}openMap()};if(!S.seenMap)$('#mapBtn').classList.add('newflash');$('#photoBtn').onclick=photo;$('#miniTog').onclick=()=>setMini(!miniOff);$('#zOut').onclick=()=>setZoom(1/1.2);$('#zIn').onclick=()=>setZoom(1.2);$('#routeChip').onclick=stopRoute;
addEventListener('keydown',e=>{if((e.key==='m'||e.key==='M')&&e.target.tagName!=='INPUT'&&!modalOpen()&&$('#dialog').hidden)openMap()});
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>requestAnimationFrame(loop));
})();
